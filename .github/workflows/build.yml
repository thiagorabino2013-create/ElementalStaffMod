
name: Build Elemental Staff

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle -p ElementalStaff build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ElementalStaff-JAR
          path: ElementalStaff/build/libs/*.jar
          if-no-files-found: error
